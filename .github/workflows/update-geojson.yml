name: Update Histopics GeoJSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-geojson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install feedparser beautifulsoup4
      - run: python scripts/update_geojson.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-all.geojson
          git diff --staged --quiet || git commit -m "Auto: neue Histopics ergänzt"
          git push
